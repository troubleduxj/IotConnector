# 开发/演示栈：TDengine + 三协议模拟器 + 网关 + 控制台
# 用法：docker compose up -d
# 控制台: http://localhost:3001  网关: http://localhost:8080  Explorer: http://localhost:16060

services:
  tdengine:
    image: tdengine/tdengine:3.3.6.13
    restart: unless-stopped
    ports:
      - "16030:6030"
      - "16041:6041"
      - "16060:6060"
    volumes:
      - tdengine-data:/var/lib/taos
    healthcheck:
      test: ["CMD", "curl", "-sf", "-u", "root:taosdata", "http://127.0.0.1:6041/-/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  s7-sim:
    image: node:22-alpine
    working_dir: /workspace/apps/gateway
    volumes:
      - .:/workspace
      - node_modules_root:/workspace/node_modules
      - node_modules_gw:/workspace/apps/gateway/node_modules
    network_mode: "service:gateway" # 与网关共享网络栈：通道 host=127.0.0.1 直接可达
    depends_on:
      - gateway
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm s7-sim"

  modbus-sim:
    image: node:22-alpine
    working_dir: /workspace/apps/gateway
    volumes:
      - .:/workspace
      - node_modules_root:/workspace/node_modules
      - node_modules_gw:/workspace/apps/gateway/node_modules
    network_mode: "service:gateway"
    depends_on:
      - gateway
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm modbus-sim"

  opcua-sim:
    image: node:22-alpine
    working_dir: /workspace/apps/gateway
    volumes:
      - .:/workspace
      - node_modules_root:/workspace/node_modules
      - node_modules_gw:/workspace/apps/gateway/node_modules
    network_mode: "service:gateway"
    depends_on:
      - gateway
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm opcua-sim"

  melsec-sim:
    image: node:22-alpine
    working_dir: /workspace/apps/gateway
    volumes:
      - .:/workspace
      - node_modules_root:/workspace/node_modules
      - node_modules_gw:/workspace/apps/gateway/node_modules
    network_mode: "service:gateway"
    depends_on:
      - gateway
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm melsec-sim"

  fins-sim:
    image: node:22-alpine
    working_dir: /workspace/apps/gateway
    volumes:
      - .:/workspace
      - node_modules_root:/workspace/node_modules
      - node_modules_gw:/workspace/apps/gateway/node_modules
    network_mode: "service:gateway"
    depends_on:
      - gateway
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm fins-sim"

  enip-sim:
    image: node:22-alpine
    working_dir: /workspace/apps/gateway
    volumes:
      - .:/workspace
      - node_modules_root:/workspace/node_modules
      - node_modules_gw:/workspace/apps/gateway/node_modules
    network_mode: "service:gateway"
    depends_on:
      - gateway
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm enip-sim"

  iec104-sim:
    image: node:22-alpine
    working_dir: /workspace/apps/gateway
    volumes:
      - .:/workspace
      - node_modules_root:/workspace/node_modules
      - node_modules_gw:/workspace/apps/gateway/node_modules
    network_mode: "service:gateway"
    depends_on:
      - gateway
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && IEC104_SIM_PORT=2404 pnpm iec104-sim"

  gateway:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace
      - node_modules_root:/workspace/node_modules
      - node_modules_gw:/workspace/apps/gateway/node_modules
      - node_modules_con:/workspace/apps/console/node_modules
      - gateway-data:/workspace/apps/gateway/data
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && TDENGINE_URL=http://tdengine:6041 pnpm --filter @iotconnector/gateway start"
    ports:
      - "8080:8080"
    depends_on:
      tdengine:
        condition: service_healthy

  console:
    image: node:22-alpine
    working_dir: /workspace/apps/console
    volumes:
      - .:/workspace
      - node_modules_root:/workspace/node_modules
      - node_modules_gw:/workspace/apps/gateway/node_modules
      - node_modules_con:/workspace/apps/console/node_modules
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --port=3001 --host=0.0.0.0 --strictPort"
    ports:
      - "3001:3001"

volumes:
  tdengine-data:
  gateway-data:
  node_modules_root:
  node_modules_gw:
  node_modules_con:

# 开发/演示栈：Go 网关（同端口托管控制台）+ TDengine + ProtoForge 协议模拟器 + IEC104 模拟器
#
# 准备：
#   pnpm release linux/amd64
#   set FB_PKG=dist/release/<版本>/factorybridge-<版本>-linux-amd64   （PowerShell: $env:FB_PKG=...）
#   docker compose up -d --build
#   docker compose exec gateway /opt/factorybridge/factorybridge user create --name admin --role admin --data-dir /data
#
# 访问：控制台/网关 https://127.0.0.1:18080（自签名证书）  ProtoForge http://127.0.0.1:8000  TDengine Explorer http://127.0.0.1:16060
#
# 模拟器：ProtoForge 覆盖 Modbus/S7/MC/FINS/AB/OPC UA/SNMP/BACnet/MQTT，在其页面或 API 按网关通道端口启动协议；
# ProtoForge 没有 IEC104，保留项目自带的 iec104-sim。Node 网关已冻结，不再出现在本栈中。

services:
  tdengine:
    image: tdengine/tdengine:3.3.6.13
    restart: unless-stopped
    ports:
      - "127.0.0.1:16041:6041"
      - "127.0.0.1:16060:6060"
    volumes:
      - tdengine-data:/var/lib/taos
    healthcheck:
      test: ["CMD", "curl", "-sf", "-u", "root:taosdata", "http://127.0.0.1:6041/-/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  protoforge:
    image: suoten/protoforge:latest
    restart: unless-stopped
    environment:
      PROTOFORGE_ADMIN_PASSWORD: ${PROTOFORGE_ADMIN_PASSWORD:?set PROTOFORGE_ADMIN_PASSWORD}
    volumes:
      - protoforge-data:/app/data
    network_mode: "service:gateway" # 与网关共享网络栈：通道配置里的 127.0.0.1:<端口> 直接可达

  iec104-sim:
    image: node:22-alpine
    working_dir: /workspace/tools/sim
    volumes:
      - .:/workspace
      - node_modules_root:/workspace/node_modules
      - node_modules_sim:/workspace/tools/sim/node_modules
    network_mode: "service:gateway"
    command: sh -c "corepack enable && pnpm install --frozen-lockfile --filter @iotconnector/sim... && IEC104_SIM_PORT=12404 pnpm iec104-sim"

  gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PKG: ${FB_PKG:?set FB_PKG to the linux release package directory}
    restart: unless-stopped
    environment:
      FB_DRIVER_MODE: go
      FB_TDENGINE_URL: http://tdengine:6041
      # 本 compose 栈是开发/演示栈，端口只绑定 127.0.0.1，TDengine 使用其镜像默认的 root 密码（taosdata）。
      # 生产环境必须修改 TDengine root 密码，并设置 TDENGINE_PASSWORD，不能沿用此默认值。
      FB_TDENGINE_PASSWORD: ${FB_TDENGINE_PASSWORD:-taosdata}
    volumes:
      - gateway-data:/data
    ports:
      - "127.0.0.1:18080:18080" # 网关
      - "127.0.0.1:8000:8000"   # ProtoForge（共享网关网络栈）
    depends_on:
      tdengine:
        condition: service_healthy

volumes:
  tdengine-data:
  gateway-data:
  protoforge-data:
  node_modules_root:
  node_modules_sim:

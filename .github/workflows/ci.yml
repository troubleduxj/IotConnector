name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/gateway-go/go.mod
          cache-dependency-path: apps/gateway-go/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm --filter @iotconnector/console build
      - run: go test ./...
        working-directory: apps/gateway-go
      - run: go vet ./...
        working-directory: apps/gateway-go
      - run: go build ./cmd/factorybridge
        working-directory: apps/gateway-go
